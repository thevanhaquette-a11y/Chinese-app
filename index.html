<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學中文 · Traditional Chinese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, studious, encouraging — a pocket exercise book.
   IDEA: the gridded character workbook (田字格) and the teacher's vermilion correction seal.
   PICTURE: the character itself, large, in its grid; the exercises are the picture.
   COLOUR and TYPE: white paper, near-black ink, seal vermilion; WenKai TC for characters, Inter + Noto Sans TC for the rest.
   LAYOUT: one phone column (max 560px), bottom tab bar, 44px targets. */
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#121214);--card:light-dark(#f6f5f3,#1c1c1f);--line:light-dark(#e6e3df,#2c2c30);
  --ink:light-dark(#17181c,#f2efe9);--mute:light-dark(#6b6966,#a29f9a);
  --red:light-dark(#d8352a,#ff6b5c);--redbg:light-dark(#fdece9,#3a1d1a);
  --ok:light-dark(#1d7f4e,#5fd59a);--okbg:light-dark(#e5f5ec,#16301f);
  --zh:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 Inter,"Noto Sans TC",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 96px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.logo{font:32px/1 var(--zh);color:var(--red)}
.htitle{flex:1;font-weight:700;line-height:1.2}.htitle small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;min-height:40px;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h1{font-size:28px;line-height:1.1;margin:20px 0 6px;text-wrap:balance}
h2{font-size:19px;margin:26px 0 10px}
.sub{color:var(--mute);margin:0 0 14px}
.zh{font-family:var(--zh)}
.lcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.seal{flex:none;width:58px;height:58px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font:30px/1 var(--zh)}
.lcard b{display:block;font-size:17px}.lcard span{color:var(--mute);font-size:14px}.lcard .seal{color:#fff;font-size:30px}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);border-radius:9px}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:12px 0;position:sticky;top:69px;z-index:4}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;min-height:40px;font-size:14px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px #0002}
.back{border:0;background:none;color:var(--red);font-weight:600;padding:10px 0;min-height:44px}
.search{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.cc{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center}
.tz{position:relative;width:62px;height:62px;margin:0 auto 6px;font:44px/62px var(--zh);border:1px solid var(--redbg);background:
 linear-gradient(var(--redbg),var(--redbg)) center/1px 100% no-repeat,linear-gradient(var(--redbg),var(--redbg)) center/100% 1px no-repeat}
.cc .p{color:var(--red);font-size:14px}.cc .e{font-size:12px;color:var(--mute);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row .w{flex:1}.row .z{font:21px/1.35 var(--zh)}.row .p{color:var(--red);font-size:14px}.row .e{color:var(--mute);font-size:14px}
.spk{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.spk svg{width:18px;height:18px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.gcard h3{margin:0 0 6px;font-size:17px}.gcard p{margin:0 0 8px}
.ex{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.ex .z{font:20px/1.3 var(--zh)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px;text-align:left;min-height:96px}
.tbtn b{display:block;font-size:20px}.tbtn span{color:var(--mute);font-size:13px}
.tbtn.wide{grid-column:1/-1;background:var(--ink);color:var(--bg)}.tbtn.wide span{color:inherit;opacity:.75}
.primary{display:block;width:100%;border:0;background:var(--red);color:#fff;border-radius:14px;padding:15px;font-weight:700;font-size:17px;min-height:52px}
.ghost{display:block;width:100%;border:1px solid var(--line);background:none;border-radius:14px;padding:13px;font-weight:600;min-height:48px;margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;min-height:58px;font-size:12px;color:var(--mute);position:relative}
nav button .zh{display:block;font-size:22px;line-height:1.2}
nav button.on{color:var(--red)}
.badge{position:absolute;top:4px;left:calc(50% + 10px);background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:18px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}.empty .zh{font-size:56px;color:var(--ok);display:block}
.stat{display:flex;gap:10px;margin:12px 0}.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px}.stat span{font-size:13px;color:var(--mute)}
.x{flex:none;border:0;background:none;color:var(--mute);width:40px;height:40px;font-size:20px}
.cnt{flex:none;font-size:12px;background:var(--redbg);color:var(--red);border-radius:9px;padding:2px 8px;font-weight:700}
/* quiz */
.quiz{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto}
.qin{max-width:560px;margin:0 auto;padding:12px 16px 40px;min-height:100%;display:flex;flex-direction:column}
.qtop{display:flex;align-items:center;gap:12px}.qtop .bar{flex:1;margin:0;height:8px}
.qtype{color:var(--mute);font-size:13px;margin:18px 0 4px;font-weight:600}
.prompt{text-align:center;padding:18px 0 22px}
.prompt .big{font:clamp(52px,16vw,84px)/1.15 var(--zh)}.prompt .mid{font:clamp(28px,8vw,38px)/1.3 var(--zh)}
.prompt .en{font-size:24px;font-weight:700;line-height:1.3}.prompt .p{color:var(--red);font-size:18px;margin-top:4px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;min-height:56px;text-align:left;font-size:17px}
.opt.zhopt{font:24px/1.3 var(--zh);text-align:center}.opt small{display:block;font:14px Inter,sans-serif;color:var(--red)}
.opt.sel{border-color:var(--ink)}.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--red);background:var(--redbg)}
.slots{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.tile{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font:22px/1.2 var(--zh);min-height:46px}
.tile.used{visibility:hidden}
.fb{position:sticky;bottom:0;margin:20px -16px -40px;padding:16px 16px 24px;border-top:2px solid}
.fb.good{background:var(--okbg);border-color:var(--ok)}.fb.bad{background:var(--redbg);border-color:var(--red)}
.fb h4{margin:0 0 6px;font-size:18px}.fb.good h4{color:var(--ok)}.fb.bad h4{color:var(--red)}
.fb .ans{display:flex;gap:10px;align-items:center;margin-bottom:12px}.fb .z{font:24px/1.3 var(--zh)}
.score{text-align:center;padding:24px 0}.score .zh{font-size:64px;color:var(--red);line-height:1}.score b{display:block;font-size:44px}
.sheet{position:fixed;inset:0;z-index:15;background:#0007;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px 28px;max-height:86vh;overflow-y:auto}
.sheet .tz{width:120px;height:120px;font-size:88px;line-height:120px}
.hide{display:none!important}
.mgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}.mgrid>div{display:grid;gap:10px;align-content:start}
.mt{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;min-height:56px;font-size:15px;line-height:1.25}.mt.zhopt{font:20px/1.3 var(--zh)}
.mt.sel{border-color:var(--ink);background:var(--card)}.mt.good{border-color:var(--ok);background:var(--okbg);opacity:.7}.mt.bad{border-color:var(--red);background:var(--redbg)}
.cells{display:inline-flex}.cell{width:84px;height:84px;display:grid;place-items:center;font:56px/1 var(--zh);border:2px solid var(--ink);margin-left:-2px;background:
 linear-gradient(var(--redbg),var(--redbg)) center/1px 100% no-repeat,linear-gradient(var(--redbg),var(--redbg)) center/100% 1px no-repeat}
.cell.empty{color:var(--mute);font-size:36px}.okc{color:var(--ok)!important}.badc{color:var(--red)!important}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.cgrid .opt{text-align:center}
.blank{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--red);color:var(--red);padding:0 4px}
.pcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}.pcard .seal{flex:none;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--zh)}
.dlg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.dlg .who{flex:none;width:28px;height:28px;border-radius:50%;background:var(--redbg);color:var(--red);display:grid;place-items:center;font-weight:700;font-size:13px}
.note{font-size:13px;color:var(--mute)}
.sync{font-size:12px;color:var(--mute);text-align:center;margin-top:24px}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.prompt:not(.still){animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav><div>
  <button data-tab="lecons"><span class="zh">課</span>Lessons</button>
  <button data-tab="erreurs"><span class="zh">錯</span>My mistakes<i class="badge hide" id="badge"></i></button>
  <button data-tab="veronica"><span class="zh">詞</span>Veronica</button>
  <button data-tab="bilans"><span class="zh">考</span>Tests</button>
</div></nav>
<div id="quiz" class="quiz hide"></div>
<div id="sheet" class="sheet hide"></div>
<script>

// Sentence: ["words separated by spaces", pinyin, english]
const LESSONS = [
{

  sub: "Numbers, people and first characters",
  chars: [
    ["一","yī","one",[["十一","shíyī","eleven"],["一個人","yí ge rén","one person"]]],

    ["木","mù","wood",[]],
    ["不","bù","not; no",[["不大","bú dà","not big"],["不少","bù shǎo","quite a lot (of)"],["不太大","bú tài dà","not very big"]]],

    ["八十六","bāshíliù","eighty-six"],

    {t:"The measure word 個", p:"In Chinese, a number never goes directly before a noun: you need a <b>measure word</b>. 個 is the most common one: <b>number + 個 + noun</b>. In speech it is often said with the neutral tone: <i>ge</i>.", ex:[["一個人","yí ge rén","one person"],["三個人","sān ge rén","three people"],["六十個人","liùshí ge rén","sixty people"]]},

{

    ["文","wén","writing, text; language",[["中文","Zhōngwén","Chinese (language)"]]],

    ["白","bái","white; Bai (surname)",[["白馬","bái mǎ","white horse"],["白天","báitiān","daytime"],["很白","hěn bái","very white"],["不白","bù bái","not white"],["不太白","bú tài bái","not very white"]]],
    ["小","xiǎo","small; young",[["小山","xiǎo shān","small hill"],["小牛","xiǎo niú","calf"],["小羊","xiǎo yáng","lamb"]]],

    ["手","shǒu","hand",[["手工","shǒugōng","handmade"],["小手","xiǎo shǒu","small hand"]]],
    ["子","zi / zǐ","(noun suffix); child",[["兒子","érzi","son"],["刀子","dāozi","knife"],["個子","gèzi","height, build"],["王子","wángzǐ","prince"]]],
    ["水","shuǐ","water",[["水上","shuǐ shàng","on the water"],["水下","shuǐ xià","underwater"],["山水","shānshuǐ","landscape"],["水牛","shuǐniú","water buffalo"],["口水","kǒushuǐ","saliva"]]],

  grammar: [
    {t:"Tones and the 3rd tone", p:"Chinese has 4 tones plus a neutral tone. When two 3rd tones follow each other, the first is pronounced as a <b>2nd tone</b> (the written pinyin stays 3rd tone). Before any other tone, a 3rd tone does not rise again: it stays low.", ex:[["你好","nǐ hǎo → ní hǎo","hello"],["老師","lǎoshī","teacher"],["很好","hěn hǎo → hén hǎo","very good"]]},
    {t:"Tone change of 不", p:"不 is pronounced <i>bù</i>, except before a 4th tone, where it becomes <b>bú</b>.", ex:[["不好","bù hǎo","not good"],["不是","bú shì","is not"],["不對","bú duì","not right"]]},
    {t:"Tone change of 一", p:"一 is said <i>yī</i> on its own or inside a number. Before a 1st, 2nd or 3rd tone it becomes <b>yì</b>; before a 4th tone (or 個) it becomes <b>yí</b>.", ex:[["一天","yì tiān","one day"],["一點","yìdiǎn","a little"],["一個","yí ge","one (of something)"],["十一","shíyī","eleven"]]},
    {t:"The particles 嗎, 呢, 吧, 的", p:"<b>嗎</b> at the end of a sentence turns it into a yes/no question. <b>呢</b> bounces the question back: “and you?”. <b>吧</b> softens (a suggestion, “right?”). <b>的</b> marks possession.", ex:[["你好嗎?","Nǐ hǎo ma?","How are you?"],["你呢?","Nǐ ne?","And you?"],["你先走吧!","Nǐ xiān zǒu ba!","You go first!"],["我的筆","wǒ de bǐ","my pen"]]},
    {t:"很 + adjective", p:"To say “X is big”, you do <b>not</b> use 是: the adjective comes straight after the subject, usually preceded by 很 (which doesn't really mean “very” here).", ex:[["我很好。","Wǒ hěn hǎo.","I'm fine."],["漢語很難。","Hànyǔ hěn nán.","Chinese is difficult."],["我很忙。","Wǒ hěn máng.","I'm busy."]]},
    {t:"是 “to be” + noun", p:"<b>A 是 B</b> links two nouns. In the negative: <b>A 不是 B</b>.", ex:[["我是大夫。","Wǒ shì dàifu.","I am a doctor."],["他不是大夫。","Tā bú shì dàifu.","He is not a doctor."]]},
    {t:"幾 “how many?” + measure word", p:"幾 asks about a small quantity (usually under 10) and goes before a measure word. Depending on context, it can also mean “a few”.", ex:[["幾個人?","jǐ ge rén?","how many people?"],["幾口人?","jǐ kǒu rén?","how many people in the family?"],["幾天","jǐ tiān","a few days"]]},
    {t:"Months and dates", p:"Months are numbered: <b>number + 月</b>. Dates go from largest to smallest: month + 月 + day + 日. “Last / next month”: 上個月 / 下個月.", ex:[["一月","Yīyuè","January"],["五月一日","Wǔyuè yī rì","May 1st"],["七月十四日","Qīyuè shísì rì","July 14th"],["下個月","xià ge yuè","next month"]]},
    {t:"Measure words", p:"Each noun has its own measure word: 條 (long things), 朵 (flowers), 本 (books), 枝 (pens), 張 (flat things), 封 (letters), 輛 (vehicles), 顆 (small round things), 隻 (one hand, animals). Before a measure word, “two” is <b>兩</b>, not 二.", ex:[["一條路","yì tiáo lù","a road"],["兩個人","liǎng ge rén","two people"],["四本書","sì běn shū","four books"],["八輛車","bā liàng chē","eight cars"]]},
    {t:"The 兒 (-r) suffix and Taiwanese usage", p:"In Beijing, people often add an <i>-r</i> at the end of words (哪兒, 一點兒). In Taiwan it is rarely used: people say 哪裡 nǎlǐ, 一點 yìdiǎn, 一下 yíxià instead.", ex:[["哪兒 / 哪裡","nǎr / nǎlǐ","where?"],["一點兒 / 一點","yìdiǎnr / yìdiǎn","a little"]]}
  ]

async function vApi(method,path,body){

/* ---------- exercises ---------- */
const TONES={a:"āáǎà",e:"ēéěè",i:"īíǐì",o:"ōóǒò",u:"ūúǔù",ü:"ǖǘǚǜ"};
const BASE={};for(const v in TONES)[...TONES[v]].forEach((c,n)=>BASE[c]=[v,n]);
function toneVariants(py){const chars=[...py],pos=chars.map((c,i)=>BASE[c]?i:-1).filter(i=>i>=0);const out=new Set();
  for(let tries=0;tries<40&&out.size<6;tries++){const c=chars.slice();const k=1+Math.floor(Math.random()*Math.min(2,pos.length));
    for(const p of shuffle(pos).slice(0,k)){const [v,n]=BASE[c[p]];let m;do{m=Math.floor(Math.random()*5)}while(m===n);c[p]=m===4?v:TONES[v][m]}
    const s=c.join("");if(s!==py)out.add(s)}return [...out]}
const MODES={write:"Write it in Chinese",zh2en:"What does it mean?",en2zh:"How do you say it in Chinese?",tone:"Which pinyin is right?",build:"Put the words in order"};
function canMode(it,m){if(m==="write")return [...it.zh].length<=14;if(m==="build")return it.kind==="sent"&&it.tk.filter(t=>!isP(t)).length>=3;
  if(m==="tone")return it.kind!=="sent"&&/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(it.py)&&!it.py.includes("/");return true}
function distract(it,field,pool){const same=pool.filter(o=>o.id!==it.id&&o[field]!==it[field]&&o.en!==it.en&&o.zh!==it.zh);
  const pref=same.filter(o=>o.kind===it.kind);let src=shuffle(pref.length>=3?pref:same);
  const out=[];const seen=new Set([it[field]]);for(const o of src){if(seen.has(o[field]))continue;seen.add(o[field]);out.push(o[field]);if(out.length===3)break}
  if(out.length<3)for(const o of shuffle(ALL)){if(seen.has(o[field])||o.en===it.en)continue;seen.add(o[field]);out.push(o[field]);if(out.length===3)break}
  return out}
function makeQ(it,mode,pool){const q={it,mode};
  if(mode==="zh2en")q.opts=shuffle([it.en,...distract(it,"en",pool)]),q.ans=it.en;
  else if(mode==="write")q.ans=it.zh;
  else if(mode==="en2zh")q.opts=shuffle([it.zh,...distract(it,"zh",pool)]),q.ans=it.zh;
  else if(mode==="tone"){const v=toneVariants(it.py);const others=shuffle(pool.filter(o=>o.py!==it.py&&o.kind===it.kind&&[...o.zh].length===[...it.zh].length).map(o=>o.py));
    const d=[...new Set([...v.slice(0,2),...others,...v.slice(2)])].filter(x=>x!==it.py).slice(0,3);q.opts=shuffle([it.py,...d]);q.ans=it.py}
  else{q.words=it.tk.filter(t=>!isP(t));q.tail=it.tk.filter(isP).map(t=>PUNCT[t]).pop()||"";q.pool=shuffle(q.words.map((w,i)=>({w,i})));
    if(q.pool.map(x=>x.w).join("")===q.words.join(""))q.pool.reverse();q.picked=[];q.ans=q.words.join(" ")}
  return q}
function buildSession(kind,lid,n){
  const pool=lid==="all"||!lid?ALL:BYL[lid];let src,modes;
  if(kind==="errors"){src=Object.keys(S.err).filter(k=>ITEMS[k]).map(k=>ITEMS[k]);modes=["zh2en","en2zh","tone","build"]}
  else{src=pool;modes=kind==="mix"||kind==="exam"?["zh2en","en2zh","tone","build","zh2en","en2zh"]:[kind]}
  let cands=shuffle(src.filter(it=>modes.some(m=>canMode(it,m))));
  // favour items not yet known
  if(kind!=="errors")cands.sort((a,b)=>(S.known[a.id]?1:0)-(S.known[b.id]?1:0)+(Math.random()-.5)*.8);
  const qs=cands.slice(0,n).map(it=>{const ok=shuffle(modes).filter(m=>canMode(it,m));return makeQ(it,ok[0],pool)});
  return qs}
/* ---------- workbook: exercises in the textbook's formats ---------- */
let UID=0;
const BKT={match:"Match the words",qmatch:"Match questions and answers",en:"Translate into English",second:"Complete the word",num:"Numbers and months",combo:"Find the combinations",listen:"Listen: which pinyin?",blank:"Fill in the blank",tf:"True or false?",qa:"Answer the question",person:"Introduce this person"};
Object.assign(MODES,BKT);
const tk2zh=s=>s.split(" ").map(t=>PUNCT[t]||t).join("");
function synth(lid,zh,py,en,tk){const id="x:"+zh;if(!ITEMS[id])ITEMS[id]={id,zh,py,en,kind:"sent",L:lid,tk:tk||null};return ITEMS[id]}
for(const L of LESSONS)if(L.book){const B=L.book;
  (B.blank||[]).forEach(b=>synth(L.id,tk2zh(b[0].replace("_",b[1])),b[3],b[4],b[0].replace("_",b[1]).split(" ")));
  (B.qa||[]).forEach(r=>{synth(L.id,tk2zh(r[3]),r[4],r[5],r[3].split(" "));if(r[6])synth(L.id,tk2zh(r[6]),r[7],r[8],r[6].split(" "))});}
ALL=Object.values(ITEMS);
/* English answer checking */

function bookClick(t,q){

  const big=[...it.zh].length<=2?"big":"mid";
  const pc=fb?"prompt still":"prompt";
  if(q.mode==="zh2en")h+=`<div class="${pc}"><div class="${big}">${esc(it.zh)}</div>${showPy?`<div class="p">${esc(it.py)}</div>`:""}<div style="display:flex;justify-content:center;margin-top:8px">${spkBtn(it.zh)}</div></div>`;
  else if(q.mode==="tone")h+=`<div class="${pc}"><div class="${big}">${esc(it.zh)}</div><div class="note">${esc(it.en)}</div></div>`;
  else h+=`<div class="${pc}"><div class="en">${esc(it.en)}</div></div>`;
  if(q.mode==="write"){
    if(showPy)h=h.replace('<div class="en">'+esc(it.en)+'</div></div>','<div class="en">'+esc(it.en)+'</div><div class="p">'+esc(it.py)+'</div></div>');
    h+=`<input class="search" id="wr" lang="zh-Hant-TW" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type in Chinese…" style="font-size:24px;text-align:center" value="${esc(q.given||"")}" ${fb?"disabled":""}>
    <p class="note" style="text-align:center">“Chinese Traditional – Pinyin” keyboard: type <i>nihao</i>, then pick 你好. Punctuation and spaces are ignored.</p>`;
    if(!fb)h+=`<button class="primary" id="checkw">Check</button><button class="ghost" id="skipw">I don't know</button>`;
  }else if(q.mode==="build"){
    h+=`<div class="slots" id="slots">${q.picked.map((p,k)=>`<button class="tile" data-unpick="${k}">${esc(q.pool[p].w)}</button>`).join("")}${q.picked.length===q.words.length?`<span class="zh" style="font-size:22px">${q.tail}</span>`:""}</div>
    <div class="pool">${q.pool.map((t,k)=>`<button class="tile ${q.picked.includes(k)?"used":""}" data-pick="${k}" ${fb?"disabled":""}>${esc(t.w)}</button>`).join("")}</div>`;
    if(!fb)h+=`<button class="primary" id="check" ${q.picked.length===q.words.length?"":"disabled style=\"opacity:.45\""}>Check</button>`;
  }else{
    const zhOpt=q.mode==="en2zh";
    h+=`<div class="opts">${q.opts.map((o,k)=>{let c="opt"+(zhOpt?" zhopt":"");
      if(fb){if(o===q.ans)c+=" good";else if(o===q.chosen)c+=" bad"}
      let sub="";if(zhOpt&&showPy){const m=ALL.find(x=>x.zh===o);if(m)sub=`<small>${esc(m.py)}</small>`}
      return `<button class="${c}" data-opt="${k}" ${fb?"disabled":""}>${esc(o)}${sub}</button>`}).join("")}</div>`;
  }
  if(fb){const ok=fb==="good";
    h+=`<div class="fb ${fb}"><h4>${ok?"對！ Correct":"Not quite…"}</h4>
    <div class="ans"><div style="flex:1"><div class="z">${esc(it.zh)}</div><div style="color:var(--red)">${esc(it.py)}</div><div>${esc(it.en)}</div></div>${spkBtn(it.zh)}</div>
    <button class="primary" id="next">Continue</button></div>`}
  h+=`</div>`;$("#quiz").innerHTML=h;
  if(fb){speak(it.zh);const n=$("#next");n&&n.focus()}
  else if(q.mode==="write"){const w=$("#wr");w&&w.focus()}
}
function answer(ok,given){
  const q=Q.qs[Q.i];if(q.it&&!q.norec)record(q.it,ok);Q.res.push({q,ok,given});save();
  if(Q.exam){nextQ();return}
  if(!ok&&!q.book&&!Q.requeued.has(q.it.id)){Q.requeued.add(q.it.id);const m=q.mode;Q.qs.push(makeQ(q.it,m,Q.lid&&Q.lid!=="all"?BYL[Q.lid]:ALL))}
  drawQ(ok?"good":"bad")}
function nextQ(){Q.i++;if(Q.i>=Q.qs.length)finish();else drawQ()}
function finish(){
  const first=new Map();for(const r of Q.res){const key=r.q.uid?"u"+r.q.uid:r.q.it.id+r.q.mode;if(!first.has(key))first.set(key,r)}
  const res=[...first.values()];const s=res.filter(r=>r.ok).length,n=res.length;
  if(Q.exam){S.tests.push({l:Q.lid||"all",s,n,d:Date.now()});if(S.tests.length>200)S.tests=S.tests.slice(-200);save()}
  const pct=Math.round(100*s/n);const seal=pct>=90?"優":pct>=70?"好":pct>=50?"可":"加油";
  const wrong=[];for(const r of res.filter(r=>!r.ok)){if(r.q.mode==="match")r.q.miss.forEach(i=>{const pr=r.q.pairs[i];wrong.push({q:{it:pr.it||{zh:pr.l,py:"",en:pr.r}},ok:false,given:""})});else if(r.q.it)wrong.push(r);else if(r.q.mode==="tf")wrong.push({q:{it:{zh:r.q.st,py:r.q.py,en:r.q.en+" → "+(r.q.ans?"true":"false")}},ok:false,given:r.given});else if(r.q.mode==="person")wrong.push({q:{it:{zh:r.q.ans,py:"",en:r.q.who.en+": "+r.q.qz}},ok:false,given:r.given});else if(r.q.mode==="combo")wrong.push({q:{it:{zh:r.q.good.map(c=>r.q.pos==="after"?r.q.x+c:c+r.q.x).join(" · "),py:"",en:"Words with "+r.q.x}},ok:false,given:r.given})}
  let h=`<div class="qin"><div class="qtop"><button class="x" data-quit aria-label="Close">×</button><div class="bar"><i style="width:100%"></i></div></div>
  <div class="score"><div class="zh">${seal}</div><b>${s} / ${n}</b><span class="note">${pct}% correct${seal==="加油"?" · 加油 jiāyóu = keep going!":""}</span></div>`;
  if(wrong.length){h+=`<h2>${Q.exam?"Corrections":"To review"} (${wrong.length})</h2>`+wrong.map(r=>{const it=r.q.it;
    return `<div class="row"><div class="w"><div class="z">${esc(it.zh)}</div><div class="p">${esc(it.py)}</div><div class="e">${esc(it.en)}</div>${r.given?`<div class="note" style="color:var(--red)">Your answer: ${esc(r.given)}</div>`:""}</div>${spkBtn(it.zh)}</div>`}).join("")+
    `<p class="note">Words and sentences you missed were added to “My mistakes”.</p>`}
  else h+=`<p class="empty">Perfect score, well done!</p>`;
  h+=`<button class="primary" id="again">Try again</button><button class="ghost" data-quit>Finish</button></div>`;
  $("#quiz").innerHTML=h;Q.done=true;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-close]");if(!t)return;
  if(t.dataset.say!==undefined){e.stopPropagation();speak(t.dataset.say);return}
  if(t.dataset.tab){go(t.dataset.tab);return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.sub){sub=t.dataset.sub;render();return}
  if(t.dataset.f){filt=t.dataset.f;render();return}
  if(t.dataset.det){detail(t.dataset.det);return}
  if(t.dataset.close!==undefined){$("#sheet").classList.add("hide");return}
  if(t.id==="pyT"){S.pinyin=!S.pinyin;save();render();return}
  if(t.dataset.start){start(t.dataset.start,t.dataset.l);return}
  if(t.dataset.exam){start("exam",t.dataset.exam==="all"?null:t.dataset.exam);return}
  if(t.dataset.vdel){const id=t.dataset.vdel;vDel(id).then(()=>{V.msg="Deleted.";render()}).catch(err=>{V.msg=err.message==="code"?"Wrong or missing edit code.":"Couldn't delete.";render()});return}
  if(t.id==="vcodeS"){V.code=$("#vcode").value.trim();try{localStorage.setItem(VKEY+"-code",V.code)}catch(_){}V.msg="Edit code saved on this device.";render();return}
  if(t.dataset.rm){delete S.err[t.dataset.rm];save();render();return}
  if(t.id==="reset"){$("#resetC").classList.remove("hide");return}
  if(t.id==="resetN"){$("#resetC").classList.add("hide");return}
  if(t.id==="resetY"){S={pinyin:S.pinyin,known:{},err:{},tests:[],t:0};save();render();return}
  if(!Q)return;
  if(t.dataset.quit!==undefined){closeQ();return}
  if(t.id==="again"){const k=Q.exam?"exam":Q.kind,l=Q.lid;closeQ();start(k,l);return}
  if(t.id==="next"){nextQ();return}
  const q=Q.qs[Q.i];if(!q||Q.done)return;
  if(q.book&&bookClick(t,q))return;
  if(t.id==="override"){const r=Q.res[Q.res.length-1];if(r&&!r.ok){r.ok=true;const e=S.err[q.it.id];if(e){e.n--;if(e.n<=0)delete S.err[q.it.id]}S.known[q.it.id]=1;save()}nextQ();return}
  if(t.dataset.opt!==undefined){const o=q.opts[+t.dataset.opt];q.chosen=o;answer(o===q.ans,o);return}
  if(t.dataset.pick!==undefined){const k=+t.dataset.pick;if(!q.picked.includes(k)){q.picked.push(k);drawQ()}return}
  if(t.dataset.unpick!==undefined){q.picked.splice(+t.dataset.unpick,1);drawQ();return}
  if(t.id==="checkw"||t.id==="skipw"){const g=t.id==="skipw"?"":($("#wr").value||"");q.given=g;answer(t.id==="checkw"&&norm(g)===norm(q.ans)&&norm(g)!=="",g||"—");return}
  if(t.id==="check"){const g=q.picked.map(k=>q.pool[k].w).join(" ");answer(g===q.ans,g.replace(/ /g,""));return}
});
document.addEventListener("submit",async e=>{if(e.target.id!=="vform")return;e.preventDefault();
  const zh=norm2($("#vzh").value),en=$("#ven").value.trim(),py=numPy($("#vpy").value.trim());
  if(!zh||!en){V.msg="Please fill in the Chinese and the English.";render();return}
  if(zh.length>60||en.length>200||py.length>120){V.msg="That's a bit long — keep it under 60 characters.";render();return}
  const b=$("#vadd");b.disabled=true;
  try{await vAdd(zh,py,en);VD={vzh:"",vpy:"",ven:""};V.msg=`Added: ${zh} = ${en}`}
  catch(err){V.msg=err.message==="code"?"Wrong or missing edit code — enter it below.":"Couldn't save. Check your connection and try again."}
  render();const f=$("#vzh");f&&f.focus()});
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")$("#sheet").classList.add("hide")});
document.addEventListener("input",e=>{if(e.target.id in VD){VD[e.target.id]=e.target.value;return}if(e.target.id==="q"){query=e.target.value.trim();const pos=e.target.selectionStart;render();const q=$("#q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&["wr","enin","nin"].includes(e.target.id)){e.preventDefault();const b=$("#checkw")||$("#checken")||$("#checkn");b&&b.click();return}if(e.key==="Escape"){if(!$("#sheet").classList.contains("hide"))$("#sheet").classList.add("hide");else if(Q)closeQ()}});
window.addEventListener("hashchange",route);
vLoad();
route();
initSync();
}
</script>
